spring.application.name=garden

# --- Datasource (H2, file mode) ---
spring.datasource.url=jdbc:h2:file:./data/garden;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- JWT ---
app.jwt.secret=${APP_JWT_SECRET:CHANGEMEINSECUREDEVDEFAULTPLACEHOLDERSETENVVARXX}
app.jwt.expiration=86400000

# --- Upload souborů (fotografie zahrad) ---
# adresář je pod data/, tedy mimo verzovani (.gitignore); vytváří se při startu, pokud neexistuje
app.upload.dir=./data/uploads
app.upload.max-size=5MB
app.upload.allowed-types=image/jpeg,image/png,image/webp

# limit multipart parseru musí odpovídat app.upload.max-size, jinak Spring odmítne request
# dřív, než se dostane k vlastní validaci ve FileStorageService
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Actuator ---
# /actuator/health je verejny (viz SecurityConfig#PUBLIC_PATHS), ostatni endpointy vyzaduji JWT
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Logging ---
logging.level.root=INFO
# vychozi uroven aplikace je INFO; pro ladeni lze bez zmeny kodu docasne zvednout na DEBUG,
# napr. spustenim s -Dlogging.level.upce.fei.garden=DEBUG nebo env LOGGING_LEVEL_UPCE_FEI_GARDEN=DEBUG
logging.level.upce.fei.garden=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
