spring.application.name=garden

# --- Datasource (H2, in-memory) ---
# Oddelena od souborove DB v data/garden pouzivane pri normalnim behu aplikace,
# aby integracni testy nikdy nezasahovaly do skutecnych dat.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false

# --- JPA / Hibernate ---
# create-drop: schema se pro kazdy testovaci kontext vytvori znovu a po skonceni zahodi
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- JWT ---
app.jwt.secret=qXvEKY29+yfHU/YrqXmN/vl5+tG+Wq30PMMVdLKN5kxy4mjF2dnZGGp9wnVWiZUYFAi7jSijzr80G9PRy2lABw==
app.jwt.expiration=86400000

# --- Upload souborů ---
# mimo data/uploads, aby testy nezasahovaly do skutecneho uploads adresare pouzivaneho pri vyvoji
app.upload.dir=${java.io.tmpdir}/garden-test-uploads
app.upload.max-size=5MB
app.upload.allowed-types=image/jpeg,image/png,image/webp
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Logging (klidnejsi vystup pri testech) ---
logging.level.upce.fei.garden=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
